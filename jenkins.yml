version: '3.8'

services:
  jenkins-docker:
    image: docker:26.1.4-dind
    container_name: jenkins-docker
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    networks:
      ams-network:
        aliases:
          - docker
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home
    ports:
      - "2376:2376"
    command: --storage-driver overlay2

  jenkins-blueocean:
    image: ghcr.io/aibles-java/jenkins:blue-ocean
    container_name: jenkins-blueocean
    restart: on-failure
    networks:
      - ams-network
    environment:
      - DOCKER_HOST=tcp://docker:2376
      - DOCKER_CERT_PATH=/certs/client
      - DOCKER_TLS_VERIFY=1
    ports:
      - "7080:7080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
    depends_on:
      - jenkins-docker
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 3s
        window: 60s

networks:
  ams-network:
    external: true

volumes:
  jenkins-data:
    driver: local
  jenkins-docker-certs:
    driver: local