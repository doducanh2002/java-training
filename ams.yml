version: '3.8'
services:
  ams:
    container_name: ams
    image: ghcr.io/aibles-java/ams:${TAG}
    ports:
      - "8080:8080"
    networks:
      - ams-network
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE}
      - SPRING_DATASOURCE_URL=${DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DATASOURCE_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_MAIL_USERNAME=${SPRING_EMAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_EMAIL_PASSWORD}
      - APPLICATION_ACCESS_TOKEN_SECRET_KEY=${ACCESS_TOKEN_SECRET_KEY}
      - APPLICATION_REFRESH_TOKEN_SECRET_KEY=${REFRESH_TOKEN_SECRET_KEY}
      - APPLICATION_ACCESS_TOKEN_LIFETIME=${ACCESS_TOKEN_LIFETIME}
      - APPLICATION_REFRESH_TOKEN_LIFETIME=${REFRESH_TOKEN_LIFETIME}
      - EXCHANGE_RATE_API_URL=${EXCHANGE_RATE_URL}
      - EXCHANGE_RATE_API_API_KEY=${EXCHANGE_RATE_API_KEY}
      - APPLICATION_PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - APPLICATION_PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - APPLICATION_PAYPAL_TUNNEL_URL=${PAYPAL_TUNNEL_URL}
      - QUARTZ_GROUP_PROMOTION=${PROMOTION_GIVEAWAY}
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 3s
        window: 60s
networks:
  ams-network:
    external: true