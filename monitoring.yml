version: '3.8'
services:
  prometheus:
    image: prom/prometheus:${PROM_VERSION}
    ports:
      - "9090:9090"
    networks:
      - ams-network
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  promtail:
    image: grafana/promtail:${LOKI_PROMTAIL_VERSION}
    volumes:
      - ./promtail-docker-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log
    command: -config.file=/etc/promtail/config.yml
    networks:
      - ams-network
  loki:
    image: grafana/loki:${LOKI_PROMTAIL_VERSION}
    volumes:
      - ./loki-local-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ams-network
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    ports:
      - "3000:3000"
    networks:
      - ams-network
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_USERNAME}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_PASSWORD}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_vol:/var/lib/grafana
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          type: loki
          access: proxy 
          orgId: 1
          url: http://loki:3100
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        EOF
        /run.sh
volumes:
  grafana_vol:
    driver: local
networks:
  ams-network:
    external: true